name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"
      - "x676c/tools/iig-8796*"
      - "x676c/tools/iig-8796-source/**"


concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    # macOS 14 runners retired 2026-11-02. Keep the existing 8796 IORPC ABI
    # with pinned generated OSS source, rather than Xcode 16's newer IIG output.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # topaz: Cortex-A53/A73 (ARMv8.0), so the same -mcpu as the kernel
          # (clang's apple-m1 default emits LSE atomics and LDAPR)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists; Xcode is preinstalled.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          test "$MACOS_VERSION/$KERNEL_CONFIG/$MACHINE_CONFIG" = "13.5/DEVELOPMENT/SWEET"
          XC=/Applications/Xcode_16.app
          test -d "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Build version 16A242d'
          xcrun --find iig
          chmod +x x676c/tools/iig-8796.py
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            compiler=$(xcrun -find "$t")
            # The restored assembly cache retained old header-derived register
            # values. Assemble from the current headers; keep caching C/C++.
            printf '#!/bin/sh\nfor arg do\n  case "$arg" in\n    *.s|*.S) exec "%s" "$@" ;;\n  esac\ndone\nexec ccache "%s" "$@"\n' "$compiler" "$compiler" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml', 'x676c/tools/iig-8796*', 'x676c/tools/iig-8796-source/**') }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          # MakeInc.def resets OTHER_CXXFLAGS; a make command-line assignment
          # in MAKEFLAGS takes precedence. Clang accepts joined -includePATH.
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }} OTHER_CXXFLAGS=-include${{ github.workspace }}/x676c/tools/iig-8796-abi.h
          IIG: ${{ github.workspace }}/x676c/tools/iig-8796.py
        run: |
          ccache -z
          bash build.sh
          ccache -s

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          platform="$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform"
          if [ -d "$platform" ]; then
            cp -R "$platform" sdk-kernel-platform/
          fi
          # Preserve available evidence even if an earlier setup/export phase
          # failed before the full kernel object tree was created.
          paths=()
          for path in build/xnu.obj build/xnu-hdrs.obj fakeroot/usr/local/include xnu; do
            if [ -e "dxb/$path" ]; then
              paths+=("$path")
            fi
          done
          if [ ${#paths[@]} -eq 0 ]; then
            echo "No XNU build tree is available for packaging" >&2
            exit 1
          fi
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb "${paths[@]}" \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - name: Verify SWEET startup policy
        if: success() && env.MACHINE_CONFIG == 'SWEET'
        run: |
          config=$(printf '%s' "$KERNEL_CONFIG" | tr '[:upper:]' '[:lower:]')
          python3 x676c/tools/verify-startup.py "out/kernel.$config.sweet"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
